name: Test e pubblicazione su GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  # 1. Test automatici (parser, Word, schede pronte, file di lavoro) a ogni push e pull request
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test

  # 2. Elenco delle schede pronte: rigenera schede/elenco.json e lo salva nel repository se è cambiato
  elenco:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Genera schede/elenco.json
        run: node scripts/genera-elenco-schede.js

      - name: Salva l'elenco se è cambiato
        run: |
          if [ -n "$(git status --porcelain -- schede/elenco.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add schede/elenco.json
            git commit -m "chore: aggiornato l'elenco delle schede pronte"
            git push
          else
            echo "schede/elenco.json già aggiornato"
          fi

  # 3. Pubblicazione del sito (con l'elenco aggiornato al passo precedente)
  deploy:
    if: github.event_name != 'pull_request'
    needs: elenco
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository (ultima versione, compreso l'elenco aggiornato)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
